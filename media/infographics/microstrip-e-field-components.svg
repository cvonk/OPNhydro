     x1="370"
     y1="132"
     x2="420"
     y2="348"
     stroke="#c0392b"
     stroke-width="3"
     marker-end="url(#arrE)"
     id="line23" />
  <text
     x="402.013"
     y="238.2897"
     fill="#c0392b"
     font-weight="bold"
     font-style="italic"
     font-size="20px"
     id="text24">E</text>
  <!-- Decomposition formula -->
  <text
     x="423.30722"
     y="237.51144"
     fill="#c0392b"
     font-size="17.214px"
     font-style="italic"
     id="text27"
     style="stroke-width:1.32415">= E<tspan
   font-size="13.2415px"
   dy="3.9724574 -3.9724574 0 0 0 0 0 3.9724574 -3.9724574"
   id="tspan24"
   style="stroke-width:1.32415">xx̂ − Ezẑ</tspan></text>
  <!-- =============== Ez CONSEQUENCE: SURFACE CHARGES (established region) =============== -->
  <!-- + charges on the dielectric-facing (bottom) surface of trace -->
  <g
     fill="#c0392b"
     font-size="15"
     font-weight="bold"
     text-anchor="middle"
     id="g33">
    <text
       x="100"
       y="118"
       id="text28">+</text>
    <text
       x="150"
       y="118"
       id="text29">+</text>
    <text
       x="200"
       y="118"
       id="text30">+</text>
    <text
       x="250"
       y="118"
       id="text31">+</text>
    <text
       x="300"
       y="118"
       id="text32">+</text>
    <text
       x="350"
       y="118"
       id="text33">+</text>
  </g>
  <!-- − charges on the dielectric-facing (top) surface of return plane -->
  <g
     fill="#2471a3"
     font-size="15"
     font-weight="bold"
     text-anchor="middle"
     id="g39">
    <text
       x="100"
       y="372"
       id="text34">−</text>
    <text
       x="150"
       y="372"
       id="text35">−</text>
    <text
       x="200"
       y="372"
       id="text36">−</text>
    <text
       x="250"
       y="372"
       id="text37">−</text>
    <text
       x="300"
       y="372"
       id="text38">−</text>
    <text
       x="350"
       y="372"
       id="text39">−</text>
  </g>
  <!-- Electrons displaced upward inside trace (away from dielectric face) -->
  <g
     fill="#2471a3"
     font-size="11"
     text-anchor="middle"
     id="g45">
    <text
       x="100"
       y="98"
       id="text40">e⁻</text>
    <text
       x="150"
       y="98"
       id="text41">e⁻</text>
    <text
       x="200"
       y="98"
       id="text42">e⁻</text>
    <text
       x="250"
       y="98"
       id="text43">e⁻</text>
    <text
       x="300"
       y="98"
       id="text44">e⁻</text>
    <text
       x="350"
       y="98"
       id="text45">e⁻</text>
  </g>
  <!-- =============== Ex CONSEQUENCE: DRIFT CURRENT IN TRACE =============== -->
  <!-- Small horizontal arrows showing conventional current along the trace (+x̂) -->
  <g
     stroke="#333"
     stroke-width="1.6"
     fill="none"
     id="g47">
    <line
       x1="374.8002"
       y1="107.46054"
       x2="414.8002"
       y2="107.46054"
       marker-end="url(#arrI)"
       id="line47" />
  </g>
  <!-- =============== CALLOUT 1 — Ez consequence =============== -->
  <g
     id="g57">
    <line
       x1="247.63496"
       y1="449.91653"
       x2="352.20242"
       y2="253.80464"
       stroke="#666666"
       stroke-width="0.600029"
       marker-end="url(#arrLeader)"
       id="line49" />
    <text
       x="40"
       y="463"
       fill="#333333"
       font-size="12px"
       id="text53"><tspan
         font-style="italic"
         fill="#c0392b"
         id="tspan49">E</tspan><tspan
         font-size="9px"
         dy="3"
         fill="#c0392b"
         id="tspan50">z</tspan><tspan
         dy="-3"
         id="tspan51">pulls electrons up in</tspan><tspan
         font-style="italic"
         id="tspan52">both </tspan><tspan
         id="tspan53">conductors:</tspan></text>
    <text
       x="40"
       y="478"
       fill="#333"
       font-size="12"
       id="text54">
      surface charges (+ on trace, − on plane) build until
    </text>
    <text
       x="40"
       y="492"
       fill="#333"
       font-size="12"
       id="text56">
      their own field cancels <tspan
   font-style="italic"
   fill="#c0392b"
   id="tspan54">E</tspan><tspan
   font-size="9"
   dy="3"
   fill="#c0392b"
   id="tspan55">z</tspan><tspan
   dy="-3"
   id="tspan56"> inside the copper</tspan></text>
    <text
       x="40"
       y="506"
       fill="#333"
       font-size="12"
       font-style="italic"
       id="text57">
      → wave is confined to the dielectric
    </text>
  </g>
  <!-- =============== CALLOUT 2 — Ex consequence =============== -->
  <g
     id="g63">
    <line
       x1="555.11713"
       y1="445.0928"
       x2="410.3924"
       y2="151.72621"
       stroke="#666666"
       stroke-width="0.720468"
       marker-end="url(#arrLeader)"
       id="line57" />
    <text
       x="455"
       y="463"
       fill="#333"
       font-size="12"
       id="text59"><tspan
         font-style="italic"
         fill="#c0392b"
         id="tspan57">E</tspan><tspan
         font-size="9"
         dy="3"
         fill="#c0392b"
         id="tspan58">x</tspan><tspan
