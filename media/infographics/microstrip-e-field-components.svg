  <g
     stroke="#c0392b"
     stroke-width="2"
     fill="none"
     id="g17">
    <line
       x1="120"
       y1="125"
       x2="120"
       y2="355"
       marker-end="url(#arrE)"
       id="line15" />
    <line
       x1="200"
       y1="125"
       x2="200"
       y2="355"
       marker-end="url(#arrE)"
       id="line16" />
    <line
       x1="280"
       y1="125"
       x2="280"
       y2="355"
       marker-end="url(#arrE)"
       id="line17" />
  </g>
  <text
     x="209.43257"
     y="267.11789"
     fill="#c0392b"
     font-style="italic"
     font-size="12px"
     id="text17"><tspan
       sodipodi:role="line"
       id="tspan75"
       x="209.43257"
       y="267.11789">almost vertical away</tspan><tspan
       sodipodi:role="line"
       id="tspan76"
       x="209.43257"
       y="282.11789">from wavefront</tspan></text>
  <!-- =============== TILTED TOTAL E AT WAVEFRONT — DECOMPOSITION =============== -->
  <!--
    Origin O = (370, 132)  (just below trace bottom face)
    Ex end   = (420, 132)  (small horizontal component)
    Ez end   = (370, 348)  (large vertical component)
    Total E  = (420, 348)  (parallelogram diagonal — the actual tilted field)
  -->
  <!-- Parallelogram completion (faint dotted) -->
  <line
     x1="420"
     y1="132"
     x2="420"
     y2="348"
     stroke="#c0392b"
     stroke-width="0.7"
     stroke-dasharray="2 3"
     opacity="0.7"
     id="line18" />
  <line
     x1="370"
     y1="348"
     x2="420"
     y2="348"
     stroke="#c0392b"
     stroke-width="0.7"
     stroke-dasharray="2 3"
     opacity="0.7"
     id="line19" />
  <!-- Ex (small horizontal component) — dashed thinner -->
  <line
     x1="370"
     y1="132"
     x2="420"
     y2="132"
     stroke="#c0392b"
     stroke-width="2"
     stroke-dasharray="6 3"
     marker-end="url(#arrEthin)"
     id="line20" />
  <text
     x="380.15784"
     y="147.73627"
     fill="#c0392b"
     font-style="italic"
     font-size="14px"
     id="text21">E<tspan
   font-size="11px"
   dy="3"
   id="tspan20">x</tspan><tspan
   dy="-3"
   id="tspan21">(small)</tspan></text>
  <!-- Ez (large vertical component) — dashed thinner -->
  <line
     x1="370"
     y1="132"
     x2="370"
     y2="348"
     stroke="#c0392b"
     stroke-width="2"
     stroke-dasharray="6 3"
     marker-end="url(#arrEthin)"
     id="line21" />
  <text
     x="312"
     y="245"
     fill="#c0392b"
     font-style="italic"
     font-size="14"
     id="text23">
    E<tspan
   font-size="11"
   dy="3"
   id="tspan22">z</tspan><tspan
   dy="-3"
   id="tspan23"> (large)</tspan></text>
  <!-- Total E (the actual tilted field) — bold solid -->
