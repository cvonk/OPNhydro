  <!--
    Close-up of the microstrip at the moment the wavefront passes.
    Decomposes the tilted E field into:
      Ez (large, vertical)  -> drives transient surface-charge
                               redistribution, cancels field inside
                               copper, confines wave to dielectric.
      Ex (small, horizontal) -> drives free-electron drift along
                                trace = sustained current.
    Side view (x-z plane): +x̂ left->right (propagation),
                           +ẑ bottom->top, +ŷ into the page.
  -->
  <defs
     id="defs5">
    <marker
       id="arrE"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#c0392b"
         id="path1" />
    </marker>
    <marker
       id="arrEthin"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#c0392b"
         id="path2" />
    </marker>
    <marker
       id="arrI"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#333333"
         id="path3" />
    </marker>
    <marker
       id="arrAx"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#333333"
         id="path4" />
    </marker>
    <marker
       id="arrLeader"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#666666"
         id="path5" />
    </marker>
  </defs>
