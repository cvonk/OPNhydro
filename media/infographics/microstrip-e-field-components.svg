<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 820 540"
   font-family="Helvetica, Arial, sans-serif"
   font-size="14"
   version="1.1"
   id="svg75"
   sodipodi:docname="microstrip-e-field-components.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview75"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.8537037"
     inkscape:cx="410.25974"
     inkscape:cy="270"
     inkscape:window-width="2160"
     inkscape:window-height="1261"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg75" />
  <!--
    Close-up of the microstrip at the moment the wavefront passes.
    Decomposes the tilted E field into:
      Ez (large, vertical)  -> drives transient surface-charge
                               redistribution, cancels field inside
                               copper, confines wave to dielectric.
      Ex (small, horizontal) -> drives free-electron drift along
                                trace = sustained current.
    Side view (x-z plane): +x̂ left->right (propagation),
                           +ẑ bottom->top, +ŷ into the page.
  -->
  <defs
     id="defs5">
    <marker
       id="arrE"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#c0392b"
         id="path1" />
    </marker>
    <marker
       id="arrEthin"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#c0392b"
         id="path2" />
    </marker>
    <marker
       id="arrI"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#333"
         id="path3" />
    </marker>
    <marker
       id="arrAx"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#333"
         id="path4" />
    </marker>
    <marker
       id="arrLeader"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#666"
         id="path5" />
    </marker>
  </defs>
  <!-- =============== GEOMETRY (close-up) =============== -->
  <!-- Dielectric (pale yellow) -->
  <rect
     x="60"
     y="120"
     width="660"
     height="240"
     fill="#fdf6c2"
     stroke="#c4b86a"
     stroke-width="0.8"
     id="rect5" />
  <!-- Trace (brown), thicker for close-up -->
  <rect
     x="60"
     y="80"
     width="660"
     height="40"
     fill="#b87333"
     stroke="#6e3f1d"
     stroke-width="1"
     id="rect6" />
  <!-- Return plane (green), thicker for close-up -->
  <rect
     x="60"
     y="360"
     width="660"
     height="40"
     fill="#4ea94e"
     stroke="#2f6b2f"
     stroke-width="1"
     id="rect7" />
  <!-- Material labels -->
  <text
     x="728"
     y="104"
     fill="#333"
     font-weight="bold"
     id="text7">trace</text>
  <text
     x="728"
     y="100"
     fill="#666"
     font-size="11"
     font-style="italic"
     dy="14"
     id="text8">(copper)</text>
  <text
     x="728"
     y="237"
     fill="#7a6a2a"
     id="text9">dielectric</text>
  <text
     x="728"
     y="251"
     fill="#7a6a2a"
     font-size="11"
     font-style="italic"
     id="text10">(FR-4)</text>
  <text
     x="728"
     y="384"
     fill="#333"
     font-weight="bold"
     id="text11">return</text>
  <text
     x="728"
     y="398"
     fill="#333"
     font-weight="bold"
     id="text12">plane</text>
  <!-- =============== WAVEFRONT =============== -->
  <line
     x1="395.22476"
     y1="28.92108"
     x2="395.22476"
     y2="428.92108"
     stroke="#6f4a6f"
     stroke-width="1.3"
     stroke-dasharray="6, 4"
     id="line12" />
  <text
     x="370.89609"
     y="22.842159"
     fill="#6f4a6f"
     font-style="italic"
     font-size="13px"
     id="text13">wavefront</text>
  <!-- Region tags -->
  <text
     x="159.46054"
     y="62.947052"
     fill="#777777"
     font-size="12px"
     font-style="italic"
     id="text14">established (fields present)</text>
  <text
     x="497.46054"
     y="62.947052"
     fill="#888888"
     font-size="12px"
     font-style="italic"
     id="text15">ahead of wavefront (no fields yet)</text>
