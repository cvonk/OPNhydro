    <text
       x="455"
       y="492"
       fill="#333"
       font-size="12"
       font-style="italic"
       id="text63">
      (the <tspan
   font-style="normal"
   id="tspan61">I</tspan><tspan
   font-size="9"
   dy="3"
   font-style="normal"
   id="tspan62">fwd</tspan><tspan
   dy="-3"
   id="tspan63"> we measure with instruments)</tspan></text>
  </g>
  <!-- =============== AXES =============== -->
  <g
     stroke="#333333"
     fill="#333333"
     id="g68"
     transform="translate(0,-6.4735265)">
