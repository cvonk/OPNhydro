<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 780 560"
     font-family="Helvetica, Arial, sans-serif"
     font-size="14">

  <!--
    Cabinet projection:
      screen_x = 180 + Y + cos(30°) * X
      screen_y = 350 - Z - sin(30°) * X
    +Y is screen right, +Z is screen up, +X is upper-right at 30°.

    Handedness note: with (+Y → screen right, +Z → screen up), right-handed
    circulation around +X̂ (right-hand rule) projects as COUNTER-clockwise on
    screen; around -X̂ it projects as clockwise.
  -->

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
    <marker id="arrBbold" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4f72"/>
    </marker>
    <marker id="arrBdash" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8cb0"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrJd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#922b21"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrAx" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>

    <pattern id="copper" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#b87333"/>
      <path d="M0,10 L10,0" stroke="#8a5220" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ================= RETURN PLANE ================= -->
  <polygon points="180,400 480,400 653.2,300 353.2,300"
           fill="url(#copper)" stroke="#6e3f1d" stroke-width="1"/>
  <polygon points="180,400 480,400 480,410 180,410"
           fill="#8a5220" stroke="#6e3f1d" stroke-width="1"/>
  <polygon points="480,400 653.2,300 653.2,310 480,410"
           fill="#9a5e28" stroke="#6e3f1d" stroke-width="1"/>

  <!-- ================= DIELECTRIC (outline) ================= -->
  <g stroke="#9a874a" stroke-width="0.9" fill="none">
    <polygon points="180,350 480,350 653.2,250 353.2,250"/>
    <polygon points="180,400 480,400 653.2,300 353.2,300" stroke-opacity="0.4"/>
    <line x1="180" y1="350" x2="180" y2="400"/>
    <line x1="480" y1="350" x2="480" y2="400"/>
    <line x1="653.2" y1="250" x2="653.2" y2="300"/>
    <line x1="353.2" y1="250" x2="353.2" y2="300"/>
  </g>
  <text x="668" y="278" fill="#9a874a" font-style="italic" font-size="12">dielectric (FR-4)</text>

  <!-- ================= TRACE ================= -->
  <polygon points="375,340 548.2,240 548.2,250 375,350"
           fill="#9a5e28" stroke="#6e3f1d" stroke-width="1"/>
  <polygon points="285,340 375,340 375,350 285,350"
           fill="#8a5220" stroke="#6e3f1d" stroke-width="1"/>
  <polygon points="285,340 375,340 548.2,240 458.2,240"
           fill="url(#copper)" stroke="#6e3f1d" stroke-width="1"/>

  <text x="310" y="232" fill="#333" font-weight="bold">trace</text>
  <text x="185" y="427" fill="#333" font-weight="bold">return plane</text>

  <!-- ================= CURRENTS (terminate at wavefront X=150) ================= -->
  <!-- Trace current (+x̂), from X=10 to X=145 along Y=150, Z=10 -->
  <g>
    <line x1="338.66" y1="335" x2="455.57" y2="267.5"
          stroke="#333" stroke-width="2.2" marker-end="url(#arrI)"/>
    <text x="448" y="262" fill="#333" font-style="italic">
      I<tspan font-size="10" dy="-4">signal</tspan><tspan dy="4"> (+x̂)</tspan>
    </text>
  </g>
  <!-- Return current (-x̂), localized under trace, from X=145 back to X=10 at Y=150, Z=-50 -->
  <g>
    <line x1="455.57" y1="327.5" x2="338.66" y2="395"
          stroke="#333" stroke-width="2.2" marker-end="url(#arrI)"/>
    <text x="300" y="412" fill="#333" font-style="italic">
      I<tspan font-size="10" dy="-4">return</tspan><tspan dy="4"> (−x̂, concentrated under trace)</tspan>
    </text>
  </g>

  <!-- ================= B LOOPS at X=40 (established region) ================= -->
  <!-- Trace-current B loop: center (364.64, 325), r=35; counter-clockwise on screen -->
  <g stroke="#2471a3" stroke-width="2" fill="none">
    <path d="M 364.64 290 A 35 35 0 0 0 329.64 325" marker-end="url(#arrB)"/>
    <path d="M 329.64 325 A 35 35 0 0 0 364.64 360" marker-end="url(#arrB)"/>
    <path d="M 364.64 360 A 35 35 0 0 0 399.64 325" marker-end="url(#arrB)"/>
    <path d="M 399.64 325 A 35 35 0 0 0 364.64 290" marker-end="url(#arrB)"/>
  </g>
  <text x="408" y="288" fill="#2471a3" font-style="italic" font-size="13">B around I<tspan font-size="9" dy="2">sig</tspan></text>

  <!-- Return-plane B loop: center (364.64, 380), r=35; clockwise on screen -->
  <g stroke="#2471a3" stroke-width="2" fill="none">
    <path d="M 364.64 345 A 35 35 0 0 1 399.64 380" marker-end="url(#arrB)"/>
    <path d="M 399.64 380 A 35 35 0 0 1 364.64 415" marker-end="url(#arrB)"/>
    <path d="M 364.64 415 A 35 35 0 0 1 329.64 380" marker-end="url(#arrB)"/>
    <path d="M 329.64 380 A 35 35 0 0 1 364.64 345" marker-end="url(#arrB)"/>
  </g>
  <text x="255" y="420" fill="#2471a3" font-style="italic" font-size="13">B around I<tspan font-size="9" dy="2">ret</tspan></text>

  <!-- ================= "Fields ADD in gap" annotation ================= -->
  <!-- Thick +y arrow at X=75, Z=-25 (gap center), spanning Y=125..175 -->
  <line x1="369.95" y1="337.5" x2="419.95" y2="337.5"
        stroke="#1b4f72" stroke-width="3.5" marker-end="url(#arrBbold)"/>
  <text x="425" y="342" fill="#1b4f72" font-weight="bold" font-size="13">
    B total (+ŷ) — fields add in gap
  </text>

  <!-- ================= E FIELD at X=110 (behind wavefront) ================= -->
  <g stroke="#c0392b" stroke-width="1.8" fill="none">
    <line x1="410.26" y1="295" x2="410.26" y2="345" marker-end="url(#arrE)"/>
    <line x1="440.26" y1="295" x2="440.26" y2="345" marker-end="url(#arrE)"/>
  </g>
  <text x="443" y="318" fill="#c0392b" font-weight="bold" font-style="italic" font-size="17">E</text>

  <!-- ================= CANCEL ANNOTATIONS far from strip ================= -->
  <!-- Above trace: opposing contributions -->
  <g stroke="#7fb3d5" stroke-width="1.4" fill="none">
    <line x1="330" y1="215" x2="310" y2="215" marker-end="url(#arrBdash)"/>
    <line x1="345" y1="228" x2="365" y2="228" marker-end="url(#arrBdash)"/>
  </g>
  <text x="240" y="200" fill="#555" font-size="11" font-style="italic">
    above trace: B(trace) + B(return)
  </text>
  <text x="240" y="213" fill="#555" font-size="11" font-style="italic">
    point opposite → cancel
  </text>

  <!-- Below return plane: opposing contributions -->
  <g stroke="#7fb3d5" stroke-width="1.4" fill="none">
    <line x1="295" y1="450" x2="315" y2="450" marker-end="url(#arrBdash)"/>
    <line x1="325" y1="465" x2="305" y2="465" marker-end="url(#arrBdash)"/>
  </g>
  <text x="180" y="482" fill="#555" font-size="11" font-style="italic">
    below plane: contributions also cancel
  </text>

  <!-- ================= WAVEFRONT at X=150 ================= -->
  <!-- Dashed indicator line on visible top surface of dielectric (left and right of trace) -->
  <g stroke="#6f4a6f" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="309.9" y1="275" x2="414.9" y2="275"/>
    <line x1="504.9" y1="275" x2="609.9" y2="275"/>
    <!-- Left vertical edge of wavefront plane (Y=0) -->
    <line x1="309.9" y1="275" x2="309.9" y2="325"/>
    <!-- Right vertical edge (Y=300) -->
    <line x1="609.9" y1="275" x2="609.9" y2="325"/>
    <!-- Bottom edge at return-plane surface -->
    <line x1="309.9" y1="325" x2="609.9" y2="325"/>
  </g>
  <text x="615" y="268" fill="#6f4a6f" font-style="italic" font-size="12">wavefront</text>

  <!-- Displacement current J_d at wavefront, under trace, -z direction -->
  <line x1="459.9" y1="275" x2="459.9" y2="325"
        stroke="#922b21" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrJd)"/>
  <text x="466" y="298" fill="#922b21" font-style="italic" font-size="13">
    J<tspan font-size="10" dy="2">d</tspan><tspan dy="-2"> = ε ∂E/∂t</tspan>
  </text>
  <text x="466" y="314" fill="#922b21" font-size="11" font-style="italic">
    (changing E at wavefront)
  </text>

  <!-- Small dashed B curl indicator around the wavefront J_d (in X-Y plane).
       Represented by two short dashed arrows showing B continues through wavefront. -->
  <g stroke="#5b8cb0" stroke-width="1.8" fill="none" stroke-dasharray="4 3">
    <!-- Ahead of wavefront: B in +ŷ (fields being "launched") -->
    <path d="M 489.9 299 A 32 32 0 0 1 479.9 332" marker-end="url(#arrBdash)"/>
    <!-- Behind wavefront: B curl closing back to established field -->
    <path d="M 439.9 332 A 32 32 0 0 1 429.9 300" marker-end="url(#arrBdash)"/>
  </g>
  <text x="495" y="340" fill="#5b8cb0" font-size="11" font-style="italic">
    B sustained by J<tspan font-size="9" dy="2">d</tspan><tspan dy="-2"> (Ampère-Maxwell)</tspan>
  </text>

  <!-- "No fields yet" ahead of wavefront -->
  <text x="555" y="225" fill="#888" font-size="11" font-style="italic">
    ahead of wavefront:
  </text>
  <text x="555" y="238" fill="#888" font-size="11" font-style="italic">
    no fields yet
  </text>

  <!-- ================= AXES ================= -->
  <g stroke="#333" fill="#333">
    <line x1="80" y1="500" x2="130" y2="500" stroke-width="1.5" marker-end="url(#arrAx)"/>
    <text x="135" y="504" font-style="italic">y</text>
    <text x="148" y="504" font-size="11" fill="#555">(across width)</text>

    <line x1="80" y1="500" x2="80" y2="455" stroke-width="1.5" marker-end="url(#arrAx)"/>
    <text x="66" y="450" font-style="italic">z</text>
    <text x="56" y="438" font-size="11" fill="#555">(up)</text>

    <line x1="80" y1="500" x2="123.3" y2="475" stroke-width="1.5" marker-end="url(#arrAx)"/>
    <text x="125" y="470" font-style="italic">x</text>
    <text x="138" y="470" font-size="11" fill="#555">(propagation)</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(540,30)">
    <rect x="0" y="0" width="220" height="170"
          fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
    <text x="10" y="20" font-weight="bold" fill="#333">Legend</text>

    <line x1="12" y1="40" x2="44" y2="40"
          stroke="#2471a3" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="52" y="44" fill="#333" font-size="12">B from conduction current</text>

    <line x1="12" y1="60" x2="44" y2="60"
          stroke="#5b8cb0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrBdash)"/>
    <text x="52" y="64" fill="#333" font-size="12">B from ∂E/∂t (displacement)</text>

    <line x1="12" y1="80" x2="44" y2="80"
          stroke="#c0392b" stroke-width="2" marker-end="url(#arrE)"/>
    <text x="52" y="84" fill="#333" font-size="12">E field</text>

    <line x1="12" y1="100" x2="44" y2="100"
          stroke="#922b21" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrJd)"/>
    <text x="52" y="104" fill="#333" font-size="12">J<tspan font-size="9" dy="2">d</tspan><tspan dy="-2"> = ε ∂E/∂t (displacement current)</tspan></text>

    <line x1="12" y1="120" x2="44" y2="120"
          stroke="#333" stroke-width="2" marker-end="url(#arrI)"/>
    <text x="52" y="124" fill="#333" font-size="12">conduction current I</text>

    <line x1="12" y1="140" x2="44" y2="140"
          stroke="#6f4a6f" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="52" y="144" fill="#333" font-size="12">wavefront plane</text>

    <text x="10" y="162" font-size="11" fill="#666" font-style="italic">
      Wave propagates in +x̂ direction.
    </text>
  </g>

</svg>
